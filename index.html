<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Shooter</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }

    .controls {
      position: fixed;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
    }

    .btn {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      text-align: center;
      line-height: 80px;
      color: white;
      font-size: 20px;
      user-select: none;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
  <div id="left" class="btn">◀</div>
  <div id="shoot" class="btn">🔥</div>
  <div id="right" class="btn">▶</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x: canvas.width/2, y: canvas.height - 80, size: 20, speed: 5 };
let bullets = [];
let enemies = [];
let score = 0;

let moveLeft = false;
let moveRight = false;

// điều khiển cảm ứng
document.getElementById("left").ontouchstart = () => moveLeft = true;
document.getElementById("left").ontouchend = () => moveLeft = false;

document.getElementById("right").ontouchstart = () => moveRight = true;
document.getElementById("right").ontouchend = () => moveRight = false;

document.getElementById("shoot").ontouchstart = shoot;

function shoot() {
  bullets.push({ x: player.x, y: player.y });
}

// spawn enemy
setInterval(() => {
  enemies.push({
    x: Math.random() * canvas.width,
    y: 0,
    size: 20,
    speed: 2 + Math.random()*2
  });
}, 700);

function update() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // di chuyển
  if (moveLeft) player.x -= player.speed;
  if (moveRight) player.x += player.speed;

  // player
  ctx.fillStyle = "white";
  ctx.fillRect(player.x, player.y, player.size, player.size);

  // bullets
  ctx.fillStyle = "yellow";
  bullets.forEach((b,i) => {
    b.y -= 7;
    ctx.fillRect(b.x, b.y, 5, 10);
    if (b.y < 0) bullets.splice(i,1);
  });

  // enemies
  ctx.fillStyle = "red";
  enemies.forEach((e,ei) => {
    e.y += e.speed;
    ctx.fillRect(e.x, e.y, e.size, e.size);

    if (e.y > canvas.height) {
      alert("Game Over! Score: " + score);
      location.reload();
    }

    bullets.forEach((b,bi) => {
      if (b.x > e.x && b.x < e.x+e.size && b.y > e.y && b.y < e.y+e.size) {
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        score++;
      }
    });
  });

  // score
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 20, 30);

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
