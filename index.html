<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Mini</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { display:block; }

.controls {
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
}

.btn {
  width:80px;
  height:80px;
  background:rgba(255,255,255,0.2);
  border-radius:50%;
  text-align:center;
  line-height:80px;
  color:white;
  font-size:20px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
  <div id="left" class="btn">◀</div>
  <div id="shoot" class="btn">🔥</div>
  <div id="right" class="btn">▶</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x:200, y:400, size:20, hp:100 };
let bullets = [];
let enemies = [];
let score = 0;

let moveLeft = false;
let moveRight = false;

// controls
left.ontouchstart = ()=> moveLeft=true;
left.ontouchend = ()=> moveLeft=false;

right.ontouchstart = ()=> moveRight=true;
right.ontouchend = ()=> moveRight=false;

shoot.ontouchstart = shootBullet;

function shootBullet(){
  bullets.push({ x:player.x, y:player.y });
}

// spawn enemy
setInterval(()=>{
  enemies.push({
    x:Math.random()*canvas.width,
    y:0,
    size:20,
    hp:20
  });
},1000);

function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // move
  if(moveLeft) player.x -=5;
  if(moveRight) player.x +=5;

  // player
  ctx.fillStyle="white";
  ctx.fillRect(player.x,player.y,20,20);

  // HP
  ctx.fillStyle="green";
  ctx.fillRect(20,20,player.hp*2,10);

  // bullets
  ctx.fillStyle="yellow";
  bullets.forEach((b,i)=>{
    b.y -= 8;
    ctx.fillRect(b.x,b.y,5,10);
  });

  // enemies
  ctx.fillStyle="red";
  enemies.forEach((e,ei)=>{
    e.y += 2;

    ctx.fillRect(e.x,e.y,20,20);

    // enemy hit player
    if(e.y > player.y){
      player.hp -= 10;
      enemies.splice(ei,1);
    }

    // bullet hit enemy
    bullets.forEach((b,bi)=>{
      if(b.x > e.x && b.x < e.x+20 && b.y > e.y && b.y < e.y+20){
        e.hp -=10;
        bullets.splice(bi,1);
      }
    });

    if(e.hp <=0){
      enemies.splice(ei,1);
      score++;
    }
  });

  // game over
  if(player.hp <=0){
    alert("Thua! Score: "+score);
    location.reload();
  }

  // score
  ctx.fillStyle="white";
  ctx.fillText("Score: "+score,20,60);

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
