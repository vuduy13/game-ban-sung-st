<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Blast Mini</title>
<style>
body { margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#222; }
</style>
</head>
<body>

<canvas id="game" width="300" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gridSize = 10;
const cell = 30;
let grid = Array(gridSize).fill().map(()=>Array(gridSize).fill(0));

let currentBlock = {
  x: 4,
  y: 0,
  shape: [[1,1],[1,1]]
};

function drawGrid(){
  for(let y=0;y<gridSize;y++){
    for(let x=0;x<gridSize;x++){
      ctx.strokeStyle="#444";
      ctx.strokeRect(x*cell,y*cell,cell,cell);

      if(grid[y][x]){
        ctx.fillStyle="cyan";
        ctx.fillRect(x*cell,y*cell,cell,cell);
      }
    }
  }
}

function drawBlock(){
  ctx.fillStyle="yellow";
  currentBlock.shape.forEach((row,dy)=>{
    row.forEach((val,dx)=>{
      if(val){
        ctx.fillRect((currentBlock.x+dx)*cell,(currentBlock.y+dy)*cell,cell,cell);
      }
    });
  });
}

function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawGrid();
  drawBlock();

  requestAnimationFrame(update);
}

document.addEventListener("click",()=>{
  currentBlock.y++;
  if(currentBlock.y > gridSize-2){
    merge();
    resetBlock();
    clearLines();
  }
});

function merge(){
  currentBlock.shape.forEach((row,dy)=>{
    row.forEach((val,dx)=>{
      if(val){
        grid[currentBlock.y+dy][currentBlock.x+dx]=1;
      }
    });
  });
}

function resetBlock(){
  currentBlock = {
    x: Math.floor(Math.random()*8),
    y: 0,
    shape: [[1,1],[1,1]]
  };
}

function clearLines(){
  for(let y=0;y<gridSize;y++){
    if(grid[y].every(cell=>cell)){
      grid.splice(y,1);
      grid.unshift(Array(gridSize).fill(0));
    }
  }
}

update();
</script>

</body>
</html>
